[versions]
# Java platform versions
java = "21"

# Core libraries
guava = "33.3.1-jre"
slf4j = "2.0.16"
jackson = "2.18.0"
commons-lang3 = "3.17.0"

# Kafka ecosystem
kafka = "4.0.0"
confluent = "7.5.1"

# Avro
avro = "1.11.3"

# Validation
jakarta-validation = "3.1.0"

# Logging
logback = "1.5.8"

# Test framework versions
junit = "5.11.2"
assertj = "3.26.3"
mockito = "5.14.2"

# Build tool versions
spotless = "7.0.0.BETA2"
checkstyle-tool = "10.20.1"
spotbugs-tool = "4.8.6"
spotbugs-plugin = "6.0.26"
dependency-check = "10.0.4"
avro-plugin = "1.9.1"

[libraries]
# Core libraries
guava = { module = "com.google.guava:guava", version.ref = "guava" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

# Jackson JSON processing
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }

# Kafka ecosystem
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
kafka-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent" }

# Avro
avro = { module = "org.apache.avro:avro", version.ref = "avro" }

# Validation
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Test libraries
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[bundles]
# Jackson bundle for JSON processing
jackson = ["jackson-core", "jackson-databind", "jackson-annotations"]

# Test bundle
test = ["junit-jupiter", "assertj-core", "mockito-core", "mockito-junit"]

# Kafka bundle
kafka = ["kafka-clients", "kafka-avro-serializer"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
avro = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "avro-plugin" }